name: Send due task notifications

on:
  schedule:
    # 9:00 AM Asia/Kolkata (UTC+05:30)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send due task notifications
        env:
          APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          JOB_TOKEN: ${{ secrets.DUE_NOTIFICATION_JOB_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$JOB_TOKEN" ]; then
            echo "::notice::Set PUBLIC_APP_URL and DUE_NOTIFICATION_JOB_TOKEN repository secrets to enable due-day push alerts."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 \
            -X POST "$APP_URL/api/jobs/due-notifications" \
            -H "Authorization: Bearer $JOB_TOKEN"
